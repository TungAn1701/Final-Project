server:
  port: 8082

spring:
  application:
    name: customer-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/insole_db}
    username: ${POSTGRES_USER:insole_user}
    password: ${POSTGRES_PASSWORD:insole_secure_password}
    driver-class-name: org.postgresql.Driver
    continue-on-error: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: "SmartOrthoticInsoleSuperSecureSecretKeyForJwtAuthenticationSpringSecurity2026!"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
